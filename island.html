<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { VignetteShader } from 'three/addons/shaders/VignetteShader.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// =====================================================================
// utils
// =====================================================================
const S = 0.5;                       // voxel size (world units)
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(11);
const pick = (a, r = rnd) => a[Math.floor(r() * a.length)];
function hash(i, j, s = 0) { let h = Math.imul(i | 0, 374761393) ^ Math.imul(j | 0, 668265263) ^ Math.imul((s | 0) + 1, 2147483647); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s = 0) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const _ca = new THREE.Color(), _cb = new THREE.Color();
function lerpHex(a, b, t) { _ca.setHex(a); _cb.setHex(b); return _ca.lerp(_cb, t).getHex(); }   // sRGB-ish mix is fine for voxel art
const C = (h) => new THREE.Color(h);

class Voxels {
  constructor(size = S) { this.size = size; this.d = []; }
  add(i, j, k, c, sc = 1) { this.d.push([i, j, k, c, sc]); }
  box(i0, j0, k0, i1, j1, k1, c) { for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (let k = k0; k <= k1; k++) this.add(i, j, k, typeof c === 'function' ? c(i, j, k) : c); }
  build(mat, { shadow = true, jit = 0.04 } = {}) {
    const n = this.d.length, sz = this.size;
    const m = new THREE.InstancedMesh(new THREE.BoxGeometry(sz, sz, sz), mat, Math.max(n, 1));
    const M = new THREE.Matrix4(), col = new THREE.Color();
    for (let q = 0; q < n; q++) {
      const [i, j, k, c, sc] = this.d[q];
      M.makeScale(sc, sc, sc); M.setPosition(i * sz, k * sz, j * sz); m.setMatrixAt(q, M);
      col.setHex(c); if (jit) col.offsetHSL(0, 0, (hash(i * 7 + 3, j * 13 + 1, Math.floor(k * 4)) - .5) * jit * 2);
      m.setColorAt(q, col);
    }
    m.count = n; m.castShadow = m.receiveShadow = shadow; m.frustumCulled = false;
    return m;
  }
}

// =====================================================================
// renderer / scene / camera
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x7b4f9a, 0.011);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.5, 1800);
camera.position.set(17, 10.5, 28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false; controls.minDistance = 7; controls.maxDistance = 60;
controls.maxPolarAngle = 1.5;
controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
let resumeTimer = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimer); });
controls.addEventListener('end', () => { resumeTimer = setTimeout(() => { controls.autoRotate = true; }, 7000); });

// =====================================================================
// time-of-day presets (lerped every frame)
// =====================================================================
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const PRE = {
  dusk: { top: C(0x3a2a78), mid: C(0xcf6a92), hor: C(0xf8a86c), fog: C(0x8d5aa8), keyCol: C(0xffa464), keyInt: 3.6, rimCol: C(0x8f7cff), rimInt: 1.8, hSky: C(0x9a78c8), hGnd: C(0x40284e), hInt: 0.85, den: 0.0105, stars: 0.3, glow: 1.0, bloom: 0.5, expo: 1.35, tint: C(0xffe8da), sun: V3(-0.9, 0.16, -0.4), disc: C(0xffc890), discK: 1, key: V3(-0.62, 0.48, 0.6), fire: 1.0 },
  night: { top: C(0x070a26), mid: C(0x1b1f66), hor: C(0x3d3a88), fog: C(0x1d1b52), keyCol: C(0x8aa6ff), keyInt: 1.1, rimCol: C(0x5a6aff), rimInt: 0.9, hSky: C(0x3a4290), hGnd: C(0x140f2e), hInt: 0.55, den: 0.0125, stars: 1.0, glow: 2.0, bloom: 0.8, expo: 1.15, tint: C(0xa8aee8), sun: V3(0.55, 0.45, -0.7), disc: C(0xbfd0ff), discK: 0.65, key: V3(0.45, 0.65, 0.55), fire: 2.6 },
  day: { top: C(0x3d86e0), mid: C(0x8ccdf2), hor: C(0xe8f4ff), fog: C(0xb4d8f0), keyCol: C(0xfff0d8), keyInt: 3.8, rimCol: C(0xa8d0ff), rimInt: 1.2, hSky: C(0xbfe4ff), hGnd: C(0x6c7a50), hInt: 1.0, den: 0.0075, stars: 0.0, glow: 0.55, bloom: 0.18, expo: 1.05, tint: C(0xffffff), sun: V3(-0.5, 0.65, -0.5), disc: C(0xfff4c8), discK: 1, key: V3(-0.45, 0.85, 0.45), fire: 0.35 },
};
const clone = (p) => { const o = {}; for (const k in p) o[k] = p[k].clone ? p[k].clone() : p[k]; return o; };
const cur = clone(PRE.dusk);
let mode = 'dusk';
function stepEnv(dt, snap) {
  const t = PRE[mode], k = snap ? 1 : 1 - Math.exp(-dt * 2.2);
  for (const key in cur) { const a = cur[key], b = t[key]; if (typeof a === 'number') cur[key] = a + (b - a) * k; else a.lerp(b, k); }
}

// =====================================================================
// sky, stars, mist sea
// =====================================================================
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: cur.top }, mid: { value: cur.mid }, hor: { value: cur.hor }, sunDir: { value: cur.sun }, disc: { value: cur.disc }, discK: { value: 1 } },
  vertexShader: `varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 top, mid, hor, sunDir, disc; uniform float discK; varying vec3 vD;
    void main(){ vec3 d = normalize(vD); float h = d.y;
      vec3 c = mix(hor, mid, smoothstep(-0.02, 0.2, h)); c = mix(c, top, smoothstep(0.12, 0.7, h));
      float s = max(dot(d, normalize(sunDir)), 0.0);
      c += disc * (pow(s, 14.0) * 0.5 + pow(s, 160.0) * 0.5) * discK;
      c += disc * smoothstep(0.9988, 0.9992, s) * 2.5 * discK;
      gl_FragColor = vec4(c, 1.0); }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), skyMat); sky.renderOrder = -10; scene.add(sky);

function dotTex(soft = 0.5) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(soft, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const DOT = dotTex(0.35);

const starGeo = new THREE.BufferGeometry(); { const n = 1500, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const u = rnd(), v = rnd() * 0.97 + 0.03, th = u * Math.PI * 2, r = Math.sqrt(1 - v * v); p.set([Math.cos(th) * r * 900, v * 900, Math.sin(th) * r * 900], i * 3); } starGeo.setAttribute('position', new THREE.BufferAttribute(p, 3)); }
const starMat = new THREE.PointsMaterial({ color: 0xdfe6ff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.3, depthWrite: false, fog: false });
scene.add(new THREE.Points(starGeo, starMat));

const seaTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); x.fillStyle = '#e6e6e6'; x.fillRect(0, 0, 256, 256);
  const r = mulberry32(5); for (let i = 0; i < 260; i++) { const px = r() * 256, py = r() * 256, rad = 14 + r() * 40, l = r() < .5 ? 255 : 196; for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]) { const g = x.createRadialGradient(px + ox, py + oy, 0, px + ox, py + oy, rad); g.addColorStop(0, `rgba(${l},${l},${l},.22)`); g.addColorStop(1, `rgba(${l},${l},${l},0)`); x.fillStyle = g; x.fillRect(px + ox - rad, py + oy - rad, rad * 2, rad * 2); } }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(22, 22); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const seaMat = new THREE.MeshBasicMaterial({ map: seaTex, color: 0x9a70b8 });
const sea = new THREE.Mesh(new THREE.CircleGeometry(1300, 48), seaMat); sea.rotation.x = -Math.PI / 2; sea.position.y = -24; scene.add(sea);

// =====================================================================
// lights
// =====================================================================
const key = new THREE.DirectionalLight(0xffa464, 3.6);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 90 });
key.shadow.normalBias = 0.03; key.shadow.bias = -0.0004;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x8f7cff, 1.8); rim.position.set(14, 10, -30); scene.add(rim);
const hemi = new THREE.HemisphereLight(0x9a78c8, 0x40284e, 0.85); scene.add(hemi);
const fireLight = new THREE.PointLight(0xff8a40, 3, 11, 1.6); scene.add(fireLight);

// =====================================================================
// island core (voxel disc with tapered, crystalline underside)
// =====================================================================
function islandCore(R, seed, hfn, topc, opt = {}) {
  const cols = new Map(), key = (i, j) => i * 1000 + j;
  for (let i = -R - 3; i <= R + 3; i++) for (let j = -R - 3; j <= R + 3; j++) {
    const a = Math.atan2(j, i), r = Math.hypot(i, j);
    const rb = R * (0.92 + 0.2 * vnoise(Math.cos(a) * 1.7 + 9, Math.sin(a) * 1.7 + 9, seed));
    if (r > rb) continue;
    const t = r / rb, h = hfn(i, j, r, rb);
    let depth = Math.round(Math.pow(1 - t, 1.15) * R * (opt.deep ?? 0.95) + 2 + vnoise(i * .32, j * .32, seed + 3) * 3);
    if (t < 0.75 && hash(i, j, seed + 5) < 0.055) depth += 3 + Math.floor(hash(j, i, seed + 6) * 6);
    cols.set(key(i, j), { i, j, h, t, r, rb, depth });
  }
  const occ = (i, j, k) => { const c = cols.get(key(i, j)); return !!c && k <= c.h && k >= c.h - c.depth; };
  const vox = new Voxels(), water = [];
  const rockA = 0x66587a, rockB = 0x251a3a;
  for (const c of cols.values()) {
    for (let k = c.h - c.depth; k <= c.h; k++) {
      if (k < c.h && k > c.h - c.depth && occ(c.i + 1, c.j, k) && occ(c.i - 1, c.j, k) && occ(c.i, c.j + 1, k) && occ(c.i, c.j - 1, k)) continue;
      const d = c.h - k; let col;
      if (d === 0) { if (opt.isWater && opt.isWater(c)) water.push(vox.d.length); col = topc(c); }
      else if (c.t > 0.78 && d <= 2 + Math.floor(hash(c.j, c.i, seed + 2) * 5) && hash(c.i, c.j, seed + 9) < 0.33) col = pick([0x4f9a3a, 0x5fae44, 0x3f8a38]);
      else if (d <= 2) col = hash(c.i + k, c.j, seed) < 0.3 ? 0x835a3a : 0x6e4a32;
      else col = lerpHex(rockA, rockB, Math.min(1, (d - 2) / Math.max(1, c.depth - 2) * 1.1)) + 0;
      vox.add(c.i, c.j, k, col);
    }
  }
  return { cols, vox, key, water, maxDepth: Math.max(...[...cols.values()].map(c => c.depth)) };
}

// shared materials
const voxMat = new THREE.MeshStandardMaterial({ roughness: 0.92, metalness: 0 });
const glowMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const k2 = (i, j) => i * 1000 + j;

// =====================================================================
// main island layout
// =====================================================================
const FIRE = [0, 3], HILL = [-1, -10], WELL = [-5, 9];
const HOUSES = [
  { i0: -14, j0: -4, w: 8, d: 6, wall: 0xf1e2c4, roof: 0xc4552f, trim: 0x7a4a2c, door: 2 },
  { i0: 8, j0: -8, w: 6, d: 6, wall: 0xe9d3b0, roof: 0x3f6aa8, trim: 0x6e4228, door: 2 },
];
const GARDEN = { i0: -12, j0: 5, w: 5, d: 4 };
const inPond = (i, j) => ((i - 8) / 4.2) ** 2 + ((j - 6) / 3.2) ** 2 < 1;
const nearPond = (i, j) => ((i - 8) / 5.4) ** 2 + ((j - 6) / 4.4) ** 2 < 1;
const inStream = (i, j) => j === 6 && i >= 12;
const isWaterCell = (i, j) => inPond(i, j) || inStream(i, j);

const pathSet = new Set();
function pathLine(pts, wid = 1) {
  for (let q = 0; q < pts.length - 1; q++) {
    const [ax, ay] = pts[q], [bx, by] = pts[q + 1], n = Math.ceil(Math.hypot(bx - ax, by - ay) * 2);
    for (let s = 0; s <= n; s++) { const x = ax + (bx - ax) * s / n, y = ay + (by - ay) * s / n; for (let di = -wid; di <= wid; di++) for (let dj = -wid; dj <= wid; dj++) if (di * di + dj * dj <= wid * wid + 0.3) pathSet.add(k2(Math.round(x) + di, Math.round(y) + dj)); }
  }
}
for (let i = -5; i <= 5; i++) for (let j = -2; j <= 8; j++) if (Math.hypot(i - FIRE[0], j - FIRE[1]) < 4.4) pathSet.add(k2(i, j));
pathLine([[-10, 3], [-7, 4], [-3, 4]]);
pathLine([[3, 2], [7, -1], [10, -1]]);
pathLine([[3, 4], [3, 6]]);
pathLine([[-2, 6], [-5, 8]]);
pathLine([[0, -1], [-1, -4], [-1, -7]]);

const hfn = (i, j) => { if (isWaterCell(i, j)) return -1; const d = Math.hypot((i - HILL[0]) * 0.85, j - HILL[1]); return d < 3 ? 2 : d < 6.5 ? 1 : 0; };
const waterCol = (c) => lerpHex(0x2f86c0, 0x78d0ee, vnoise(c.i * .5, c.j * .5, 4) * .8 + hash(c.i, c.j, 8) * .2);
function topc(c) {
  const i = c.i, j = c.j;
  if (isWaterCell(i, j)) return waterCol(c);
  if (pathSet.has(k2(i, j))) return hash(i, j, 3) < .5 ? 0xbf9d6c : 0xaa8a5e;
  if (c.r > c.rb - 2.2 || (nearPond(i, j) && c.h === 0 && hash(i, j, 1) < 0.85)) return hash(i, j, 2) < .5 ? 0xdcc48c : 0xcdb27a;
  const n = vnoise(i * .18, j * .18, 7);
  if (c.h >= 1) return lerpHex(0x6cae48, 0x86c256, n);
  return n < .4 ? lerpHex(0x4a8a3a, 0x5d9b3b, n / .4) : lerpHex(0x5d9b3b, 0x76b046, (n - .4) / .6);
}
const MAIN = islandCore(20, 3, hfn, topc, { isWater: (c) => isWaterCell(c.i, c.j), deep: 1.35 });
const cols = MAIN.cols;
const colAt = (i, j) => cols.get(k2(i, j));
const hAt = (i, j) => { const c = colAt(i, j); return c ? c.h : null; };

const main = new THREE.Group(); scene.add(main);
main.add(MAIN.vox.build(voxMat, { jit: 0.05 }));

// =====================================================================
// decorations on the main island
// =====================================================================
const deco = new Voxels(), glow = new Voxels();
const blk = new Set();
const block = (i, j, r) => { for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) if (a * a + b * b <= r * r + 0.5) blk.add(k2(i + a, j + b)); };
const dockSet = new Set();

// --- dock + bridge ---
for (let i = 4; i <= 9; i++) for (let j = 5; j <= 6; j++) { dockSet.add(k2(i, j)); const h = hAt(i, j); if (h === -1) deco.add(i, j, 0, (i + j) % 2 ? 0x9a6a3e : 0x8a5c36); }
for (let i = 14; i <= 16; i++) { dockSet.add(k2(i, 6)); deco.add(i, 6, 0, i % 2 ? 0x9a6a3e : 0x8a5c36); }
for (const [i, j] of [[9, 4], [10, 7]]) { if (hAt(i, j) === -1) { for (let k = -1; k <= 2; k++) deco.add(i, j, k, 0x6b4428); } }
glow.add(9, 4, 3, 0xffc860);

// --- houses ---
const chimneys = [], doors = [];
function house(H) {
  const { i0, j0, w, d, wall, roof, trim } = H, k0 = 1, HT = 5, j1 = j0 + d - 1, i1 = i0 + w - 1;
  const doorI = i0 + H.door + (w >= 8 ? 1 : 0);
  const isDoor = (i, j, k) => j === j1 && (i === doorI || i === doorI + 1) && k < k0 + 3;
  const winSide = (i, j, k) => (i === i0 || i === i1) && (j === j0 + 2 || j === j0 + 3) && (k === k0 + 2 || k === k0 + 3);
  const winFront = (i, j, k) => w >= 8 && j === j1 && ((i === i0 + 1 || i === i0 + 2) || (i === i1 - 2 || i === i1 - 1)) && (k === k0 + 2 || k === k0 + 3);
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (let k = k0; k < k0 + HT; k++) {
    if (i !== i0 && i !== i1 && j !== j0 && j !== j1) continue;

function faceToward(c, x, z) { const dx = x - c.pos.x, dz = z - c.pos.z, l = Math.hypot(dx, dz) || 1; c.face.set(dx / l, dz / l); }
function arrive(c) {
  const kind = c.kind; c.state = 'act'; c.path = null;
  if (kind === 'fire') faceToward(c, FIRE[0] * S, FIRE[1] * S); else if (kind === 'pond') c.face.set(1, 0.2); else if (kind === 'tree') faceToward(c, HILL[0] * S, HILL[1] * S); else if (kind === 'well') faceToward(c, WELL[0] * S, WELL[1] * S); else if (kind === 'house') c.face.set(0, -1);
  c.timer = kind === 'wander' ? 1 + rnd() * 2 : kind === 'house' ? 7 + rnd() * 8 : 9 + rnd() * 12;
  if (kind === 'house') { c.hidden = true; speak(c, 'house'); } else if (rnd() < .8) speak(c, kind);
}
function speak(c, k) { const arr = SAYS[k] || SAYS.wander; c.say = pick(arr); c.sayT = 2.6; }

const camFwd = new THREE.Vector3(), camRight = new THREE.Vector3(), tmpV = new THREE.Vector3();
function stepChars(t, dt) {
  camera.getWorldDirection(camFwd); camFwd.y = 0; camFwd.normalize(); camRight.set(-camFwd.z, 0, camFwd.x).multiplyScalar(-1).negate();   // right = fwd x up
  camRight.crossVectors(camFwd, new THREE.Vector3(0, 1, 0)).normalize();
  for (const c of chars) {
    c.chatCd -= dt; c.sayT -= dt;
    let moving = false;
    if (c.state === 'idle') { c.timer -= dt; if (c.timer <= 0) chooseAct(c); }
    else if (c.state === 'walk') {
      const tgt = c.path[c.pi], tx = tgt[0] * S, tz = tgt[1] * S, dx = tx - c.pos.x, dz = tz - c.pos.z, d = Math.hypot(dx, dz), step = c.speed * dt * (c.hurry ? 1 : 1);
      if (d <= step) { c.pos.x = tx; c.pos.z = tz; c.pi++; if (c.pi >= c.path.length) arrive(c); } else { c.pos.x += dx / d * step; c.pos.z += dz / d * step; c.face.set(dx / d, dz / d); moving = true; }
    } else if (c.state === 'act') {
      c.timer -= dt;
      if (c.timer <= 0) { if (c.hidden) { c.hidden = false; } c.state = 'idle'; c.timer = 0.2 + rnd() * 1.5; c.act = ACT_TXT.idle; }
      else if (c.kind === 'pond' && rnd() < dt * 0.15) speak(c, 'pond');
    } else if (c.state === 'chat') {
      c.timer -= dt; if (c.timer <= 0) { c.state = 'idle'; c.timer = 0.3; }
      else if (c.sayT <= 0) speak(c, 'chat');
    }
    // chat trigger
    if ((c.state === 'walk' || c.state === 'idle') && c.chatCd <= 0 && !c.hidden) for (const o of chars) {
      if (o === c || o.hidden || (o.state !== 'walk' && o.state !== 'idle') || o.chatCd > 0) continue;
      if (Math.hypot(o.pos.x - c.pos.x, o.pos.z - c.pos.z) < 1.1) {
        for (const [a, b] of [[c, o], [o, c]]) { a.state = 'chat'; a.timer = 4 + rnd() * 2; a.chatCd = 16 + rnd() * 10; a.act = ACT_TXT.chat; faceToward(a, b.pos.x, b.pos.z); a.path = null; }
        speak(c, 'chat'); o.sayT = -1.2; break;
      }
    }
    // vertical follow
    const gy = groundH(c.pos.x, c.pos.z); c.y += (gy - c.y) * Math.min(1, dt * 14);
    c.phase += moving ? dt * c.speed * 4.2 : 0;
    const frame = moving ? (Math.floor(c.phase) % 2 === 0 ? 1 : 2) : 0;
    const a = c.face.x * camFwd.x + c.face.y * camFwd.z, b = c.face.x * camRight.x + c.face.y * camRight.z;
    let dir, flip = 1; if (Math.abs(b) > Math.abs(a)) { dir = 2; flip = b >= 0 ? 1 : -1; } else dir = a > 0 ? 1 : 0;
    const col = frame, row = dir;
    c.tex.repeat.x = flip / 3; c.tex.offset.x = (flip > 0 ? col : col + 1) / 3; c.tex.offset.y = 1 - (row + 1) / 3;
    c.sp.position.set(c.pos.x, c.y + (moving && frame ? 0.0 : 0) + (c.hidden ? -10 : 0), c.pos.z); c.sp.visible = !c.hidden;
    c.sh.position.set(c.pos.x, c.y + 0.03, c.pos.z); c.sh.visible = !c.hidden;
    c.mat.color.copy(cur.tint);
  }
}
const selCard = document.getElementById('card'); let selected = null;
function updateOverlay() {
  const W = innerWidth, H = innerHeight;
  for (const c of chars) {
    tmpV.set(c.pos.x, c.y + FH * PX + 0.1, c.pos.z).project(camera);
    const vis = !c.hidden && tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1;
    const x = (tmpV.x * .5 + .5) * W, y = (-tmpV.y * .5 + .5) * H;
    c.el.style.left = x + 'px'; c.el.style.top = (y - 2) + 'px'; c.el.textContent = c.say; c.el.classList.toggle('show', vis && c.sayT > 0);
    c.nm.style.left = x + 'px'; c.nm.style.top = (y + 2) + 'px'; c.nm.classList.toggle('show', vis && c === selected);
    c.nm.style.display = 'block';
  }
  if (selected) selCard.innerHTML = `<b>${selected.def.n}</b><div>${selected.def.bio}</div><div>지금: ${selected.act || '멍하니 있는 중'}</div>`;
}
// pick + follow
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(chars.filter(c => !c.hidden).map(c => c.sp), false)[0];
  selected = hit ? chars[hit.object.userData.char] : null; selCard.style.display = selected ? 'block' : 'none';
});
document.querySelectorAll('#tod button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; document.querySelectorAll('#tod button').forEach(x => x.classList.toggle('on', x === b)); }));

// =====================================================================
// post
// =====================================================================
const rt = new THREE.WebGLRenderTarget(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio(), { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.55, 0.62); composer.addPass(bloom);
const vig = new ShaderPass(VignetteShader); vig.uniforms.offset.value = 1.0; vig.uniforms.darkness.value = 1.0; composer.addPass(vig);
composer.addPass(new OutputPass());

// =====================================================================
// loop
// =====================================================================
const water = MAIN.water, waterMesh = main.children[0];
const tmpC = new THREE.Color();
let last = performance.now() / 1000, T = 0, frameN = 0;
function applyEnv() {
  skyMat.uniforms.discK.value = cur.discK;
  scene.fog.color.copy(cur.fog); scene.fog.density = cur.den; scene.background = null;
  key.color.copy(cur.keyCol); key.intensity = cur.keyInt; key.position.copy(cur.key).normalize().multiplyScalar(45); key.target.position.set(0, 0, 0);
  rim.color.copy(cur.rimCol); rim.intensity = cur.rimInt; hemi.color.copy(cur.hSky); hemi.groundColor.copy(cur.hGnd); hemi.intensity = cur.hInt;
  glowMat.color.setScalar(cur.glow); starMat.opacity = cur.stars; bloom.strength = cur.bloom; renderer.toneMappingExposure = cur.expo;
  seaMat.color.copy(cur.fog).multiplyScalar(1.12).lerp(cur.hor, 0.08);
  ringGroup.userData.orb.material.color.copy(cur.disc).multiplyScalar(0.6 + cur.glow * 0.3);
}
function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.05, now - last); last = now; T += dt; frameN++;
  stepEnv(dt); applyEnv();
  fireLight.intensity = (2.2 + Math.sin(T * 17) * .5 + Math.sin(T * 7.3) * .4) * cur.fire; fireMesh.scale.set(1, 0.85 + Math.sin(T * 11) * 0.12 + Math.sin(T * 5.1) * .08, 1); fireMesh.rotation.y = Math.sin(T * 3) * 0.2;
  if (frameN % 4 === 0) { const col = new THREE.Color(), a = waterMesh.instanceColor; for (const q of water) { const d = MAIN.vox.d[q]; col.setHex(lerpHex(0x2f86c0, 0x8ee0f4, Math.min(1, Math.max(0, vnoise(d[0] * .5 + T * .6, d[1] * .5 - T * .4, 4) * .85 + hash(d[0], d[1], 8) * .15)))); a.setXYZ(q, col.r, col.g, col.b); } a.needsUpdate = true; }
  floaters.forEach((f, q) => { f.g.position.y = f.base + Math.sin(T * 0.7 + f.phase) * 0.28; f.g.rotation.y = Math.sin(T * 0.15 + f.phase) * 0.06; });
  flames.forEach((f, q) => { f.scale.set(1 + Math.sin(T * 20 + q) * .1, 0.8 + Math.sin(T * 13 + q * 2) * .25, 1 + Math.sin(T * 17) * .1); f.material.opacity = 0.7 + Math.sin(T * 9 + q) * .15; });
  beams.forEach(b => { b.rotation.y = T * 0.55; });
  pebbles.forEach(p => { p.m.position.y += Math.sin(T * p.sp + p.ph) * 0.004; p.m.rotation.x += 0.003 * p.sp; p.m.rotation.y += 0.004 * p.sp; });
  clouds.forEach(c => { c.m.position.x += c.sp * dt; if (c.m.position.x > 150) c.m.position.x = -150; });
  ringGroup.children.forEach(g => { if (g.userData.sp) g.rotation.y += g.userData.sp * dt; });
  ringGroup.position.y = 12.5 + Math.sin(T * 0.6) * 0.25;
  wfTex.offset.y -= dt * 1.6;
  stepParticles(T, dt); stepChars(T, dt); updateOverlay();
  if (selected && !selected.hidden) controls.target.lerp(tmpV.set(selected.pos.x, selected.y + 0.8, selected.pos.z), 0.06);
  else controls.target.lerp(tmpV.set(0, 1.5, 0), 0.04);
  controls.update(); composer.render();
}
renderer.setAnimationLoop(frame);
addEventListener('resize', () => { if (!innerWidth || !innerHeight) return; renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.__setMode = (m) => { mode = m; stepEnv(0, true); document.querySelectorAll('#tod button').forEach(x => x.classList.toggle('on', x.dataset.m === m)); };
window.__tick = (sec, dt = 0.05) => { for (let q = 0; q < sec / dt; q++) { T += dt; stepChars(T, dt); } return chars.map(c => c.def.n + ':' + c.state + ':' + c.kind + ':' + c.pos.x.toFixed(1) + ',' + c.pos.z.toFixed(1)).join(' '); };
window.__dbg = { chars, camera, controls, scene };
requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; }));
</script>
</body>
